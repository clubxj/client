[package]
name = "loader"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.10.0"
async-channel = "2.5.0"
image = { version = "0.25.10", default-features = false }
futures = "0.3.31"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ron = "0.12.2"
decode = { path = "../decode" }
injector = { version = "0.1.0", path = "../injector", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
sha2 = "0.11.1"
ring = "0.17"
base64 = "0.23.1"
rand = "0.10.3"
webbrowser = "1.2.5"
directories = "6.0.0"
keyring = "4.2.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
minisign-verify = "0.3.0"

[target.'cfg(unix)'.dependencies]
flate2 = "1.1.10"
libc = "0.2"
tar = "0.4.46"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ApplicationInstallationAndServicing"] }

[dev-dependencies]
minisign = "0.10.0"
gpui-kit = { version = "0.10.0", features = ["test-support"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
